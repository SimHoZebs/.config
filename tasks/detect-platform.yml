---
- name: Detect dnf package manager
  ansible.builtin.command: which dnf
  register: dnf_check
  failed_when: false
  changed_when: false

- name: Detect apt package manager
  ansible.builtin.command: which apt
  register: apt_check
  failed_when: false
  changed_when: false

- name: Detect Homebrew
  ansible.builtin.command: which brew
  register: brew_check
  failed_when: false
  changed_when: false

- name: Detect yum package manager
  ansible.builtin.command: which yum
  register: yum_check
  failed_when: false
  changed_when: false

- name: Set package manager facts
  ansible.builtin.set_fact:
    has_dnf: "{{ dnf_check.rc == 0 }}"
    has_apt: "{{ apt_check.rc == 0 }}"
    has_brew: "{{ brew_check.rc == 0 }}"
    has_yum: "{{ yum_check.rc == 0 }}"

- name: Detect architecture and OS
  ansible.builtin.set_fact:
    is_arm: "{{ ansible_facts['architecture'] in ['aarch64', 'armv7l', 'armv6l'] }}"
    is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
    needs_brew: "{{ ansible_facts['os_family'] != 'Darwin' }}"
