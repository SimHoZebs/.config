---
- name: Ensure winget is available
  ansible.windows.win_command: winget --version
  register: winget_check
  changed_when: false

- name: Install Windows packages via winget
  ansible.windows.win_powershell:
    script: |
      param(
        [Parameter(Mandatory = $true)]
        [string]$PackageId
      )

      $ErrorActionPreference = 'Stop'
      $existing = winget list --id $PackageId --exact --source winget 2>$null
      if ($LASTEXITCODE -eq 0 -and ($existing -match [regex]::Escape($PackageId))) {
        Write-Output 'OK'
        return
      }

      winget install --id $PackageId --exact --source winget --accept-source-agreements --accept-package-agreements
      if ($LASTEXITCODE -ne 0) {
        throw "winget failed to install $PackageId with exit code $LASTEXITCODE"
      }

      Write-Output 'CHANGED'
    parameters:
      PackageId: "{{ item.value.winget }}"
  loop: "{{ packages | dict2items | selectattr('value.winget', 'defined') | list }}"
  loop_control:
    label: "{{ item.value.name | default(item.key) }}"
  register: winget_install
  changed_when: "'CHANGED' in winget_install.output"
