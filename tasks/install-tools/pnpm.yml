---
- name: Check if pnpm is installed
  ansible.builtin.command:
    cmd: pnpm --version
  register: pnpm_check
  ignore_errors: true
  changed_when: false

- name: Install pnpm via Homebrew (ARM/macOS)
  community.general.homebrew:
    name: pnpm
    state: present
  when: pnpm_check.rc != 0 and needs_brew

- name: Install pnpm via standalone script (x86_64 Linux)
  ansible.builtin.shell:
    cmd: curl -fsSL https://get.pnpm.io/install.sh | sh -
  args:
    executable: /bin/bash
  when: pnpm_check.rc != 0 and not needs_brew

- name: Add pnpm to PATH in .bashrc
  ansible.builtin.lineinfile:
    path: ~/.config/.bashrc
    line: 'export PATH="$HOME/.local/share/pnpm:$PATH"'
    regexp: 'export PATH.*pnpm'
    state: present
  when: not needs_brew