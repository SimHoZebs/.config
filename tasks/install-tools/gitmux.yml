---
- name: Check if go is installed
  ansible.builtin.command: which go
  register: go_check
  failed_when: false
  changed_when: false

- name: Check if gitmux is installed
  ansible.builtin.command: ~/go/bin/gitmux -V
  register: gitmux_check
  failed_when: false
  changed_when: false
  when: go_check.rc == 0

- name: Install gitmux using go install
  ansible.builtin.shell: go install github.com/arl/gitmux@latest
  args:
    executable: /bin/bash
  when: go_check.rc == 0 and gitmux_check.rc != 0
