---
- name: Check if fd is installed
  ansible.builtin.command:
    cmd: fd --version
  register: fd_check
  ignore_errors: true
  changed_when: false

- name: Install fd via Homebrew (macOS/Debian/Ubuntu)
  community.general.homebrew:
    name: fd
    state: present
  when: fd_check.rc != 0 and has_brew

- name: Install fd via dnf (Fedora/CentOS)
  ansible.builtin.dnf:
    name: fd-find
    state: present
  become: true
  when: fd_check.rc != 0 and has_dnf and not has_brew
