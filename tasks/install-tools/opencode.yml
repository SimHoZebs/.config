---
- name: Check if opencode is installed
  ansible.builtin.command:
    cmd: opencode --version
  register: opencode_check
  failed_when: false
  changed_when: false

- name: Tap sst/tap repository
  community.general.homebrew_tap:
    name: sst/tap
    state: present
  when: opencode_check.rc != 0 and needs_brew

- name: Install opencode via Homebrew (ARM/macOS)
  community.general.homebrew:
    name: sst/tap/opencode
    state: present
  when: opencode_check.rc != 0 and needs_brew

- name: Install opencode via curl (x86_64 Linux)
  ansible.builtin.shell:
    cmd: curl -fsSL https://opencode.ai/install | bash
  when: opencode_check.rc != 0 and not needs_brew
