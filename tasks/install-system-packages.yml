---
- name: Install essential packages using built-in package manager
  ansible.builtin.package:
    name:
      - curl
      - git
      - btop
      - wget
      - gcc
      - cmake
      - fzf
      - unzip
      - rsync
      - ripgrep
      - luarocks
      - python3-pip
      - neovim
      - nodejs
      - tmux
      - gh
    state: present
    update_cache: true
  become: true

- name: Check if rustup is installed
  ansible.builtin.command: rustup --version
  register: rustup_check
  ignore_errors: true
  changed_when: false

- name: Install rustup
  ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    executable: /bin/bash
  when: rustup_check.rc != 0

- name: Check if tiktoken_core is installed
  ansible.builtin.shell: luarocks show tiktoken_core --local
  args:
    executable: /bin/bash
  register: tiktoken_check
  ignore_errors: true
  changed_when: false

- name: Install tiktoken_core via luarocks
  ansible.builtin.shell: |
    . ~/.cargo/env
    luarocks install tiktoken_core --local
  args:
    executable: /bin/bash
  when: tiktoken_check.rc != 0
