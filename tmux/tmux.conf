
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# increase the scroll history
set-option -g history-limit 100000
set-option -sg escape-time 10
set-option -g focus-events on
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"
set -g extended-keys on
set -as terminal-features ',xterm-256color:extkeys:RGB'
set -as terminal-features ',wezterm*:clipboard'
set -g set-clipboard on

set-option -g status-position top
set-option -g repeat-time 350
set -g status-interval 2

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Automatically set window title
setw -g automatic-rename on
set -g automatic-rename-format '#(~/.config/tmux/pane-name.sh "#{window_id}")'
set-hook -g pane-focus-in "set -w automatic-rename on"

set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "left"

# active pane highlight
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa,bold'
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format ""
set -g window-style default
set -g window-active-style default

# vim-style nav
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null 2>&1 && test -S "${XDG_RUNTIME_DIR%/}/${WAYLAND_DISPLAY}"; then wl-copy; else win32yank.exe -i --crlf; fi'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null 2>&1 && test -S "${XDG_RUNTIME_DIR%/}/${WAYLAND_DISPLAY}"; then wl-copy; else win32yank.exe -i --crlf; fi'
bind P run-shell 'if command -v wl-paste >/dev/null 2>&1 && test -S "${XDG_RUNTIME_DIR%/}/${WAYLAND_DISPLAY}"; then wl-paste; else win32yank.exe -o --lf; fi | tmux load-buffer - && tmux paste-buffer'

# use vim-style hjkl navigation for pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g status-left '#(gitmux -cfg $HOME/.config/gitmux.conf "#{pane_current_path}")'
set -g status-right-length 50
set -g status-left-length 50
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " #(date -u '+%m-%d %H:%M:%S')"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux#v2.1.2'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
# run '~/.config/tmux/plugins/tmux-sensible/sensible.tmux'
run '~/.config/tmux/plugins/tpm/tpm'
